[project]
name = "rel-sync"
version = "0.1.0"
description = "Keep the relationship graph fresh from this machine — AIOS workspace, Fathom, and Composio."
requires-python = ">=3.9"
# Standard library only: a connector you have to install dependencies for is a
# connector that rots. Everything here runs on the system Python.
dependencies = []

[project.scripts]
rel-sync = "rel_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rel_sync"]
